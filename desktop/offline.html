<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAW by aurare</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080a;color:#f0eee8;font:15px/1.5 -apple-system,system-ui,sans-serif;text-align:center}
.c{display:grid;gap:14px;justify-items:center;padding:16px}p{margin:0;color:#86858f}button{height:34px;padding:0 16px;border-radius:9px;border:1px solid #2d2d36;background:#f0eee8;color:#08080a;font:inherit;font-weight:600;cursor:pointer}</style></head>
<body><div class="c"><strong>RAW ne trouve pas Internet</strong><p>Vérifie ta connexion, puis réessaie.</p><button id="b">Réessayer</button></div>
<script>document.getElementById("b").onclick=()=>{const to=new URLSearchParams(location.search).get("to");location.href=to&&/^https:\/\//.test(to)?to:"https://raw.aurare.app/studio";};</script></body></html>
